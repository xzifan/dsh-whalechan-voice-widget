<text x="434.0" y="277.0" fill="#8b949e" font-size="11" text-anchor="middle">PCM</text>
<rect x="222" y="250" width="190" height="70" rx="10" fill="#141820" stroke="#7ee787" stroke-opacity="0.55" stroke-width="1.2"/>
