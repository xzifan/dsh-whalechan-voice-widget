<text x="526" y="442" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">~/.dsh/AGENTS.md</text>
<text x="526" y="459" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">身份 / 性格 / 禁忌 / 风格</text>
<rect x="752" y="396" width="222" height="74" rx="10" fill="#141820" stroke="#f0b429" stroke-opacity="0.55" stroke-width="1.2"/>
