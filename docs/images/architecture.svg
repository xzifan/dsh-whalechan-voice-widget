<text x="466" y="163" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">鉴权 + 限流</text>
<text x="466" y="180" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">工具调用转 DSH 执行</text>
<rect x="682" y="100" width="286" height="86" rx="10" fill="#141820" stroke="#ff9ecb" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="696" y="124" fill="#e6edf3" font-size="14.5" font-weight="600">Qwen-Audio-Realtime</text>
<text x="696" y="146" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">理解 · 回复 · 语义打断</text>
<text x="696" y="163" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">smart_turn / Function Calling</text>
