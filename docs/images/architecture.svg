<text x="286" y="420" fill="#e6edf3" font-size="14.5" font-weight="600">审计与统计</text>
<text x="286" y="442" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">JSONL · 2000 条 / 10 MiB</text>
<text x="286" y="459" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">转录 / 用量 / 工具记录</text>
<rect x="512" y="396" width="222" height="74" rx="10" fill="#141820" stroke="#f0b429" stroke-opacity="0.55" stroke-width="1.2"/>
