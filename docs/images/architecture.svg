<text x="696" y="296" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">Qwen TTS · Breeze Blue · OpenAI</text>
<text x="696" y="313" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">或关掉自定义语音用 Realtime 原生</text>
