<text x="236" y="296" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">播放状态回传，中断即停</text>
<text x="32" y="380" fill="#8b949e" font-size="12" font-weight="600">支撑面（所有链路共用）</text>
