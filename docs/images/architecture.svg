<rect width="1000" height="560" fill="#0b0d10"/>
<text x="32" y="46" fill="#e6edf3" font-size="19" font-weight="700">架构：Realtime 是大脑，TTS 是可换的声音层</text>
<text x="32" y="70" fill="#8b949e" font-size="12.5">一条链路：麦克风 → 实时模型（理解/回复/打断/工具）→ 文字 → 声音层 → 播放</text>
