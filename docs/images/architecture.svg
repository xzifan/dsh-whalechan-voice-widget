<text x="46" y="156" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">16kHz PCM</text>
<rect x="222" y="110" width="190" height="66" rx="10" fill="#141820" stroke="#6aa9ff" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="236" y="134" fill="#e6edf3" font-size="14.5" font-weight="600">浏览器前端</text>
<text x="236" y="156" fill="#8b949e" font-size="11.8" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">采集 / 播放 / 字幕</text>
