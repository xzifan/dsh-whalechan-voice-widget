name: CI

# push 与 PR 自动触发已恢复：2026-10-28 早些时候 Actions 曾因账户账单锁拒跑任务
# （"The job was not started because your account is locked due to a billing issue"），
# 于是临时改成手动触发；当天晚些时候账单恢复、runner 正常，这里恢复自动触发。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本一致性测试要读 tag：浅克隆拿不到，会让断言静默跳过
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run backend tests
        run: npm test

      # 覆盖率门槛只在一个 leg 上跑：--test-coverage-* 系列参数要 Node >=22.8，
      # Node 20 leg 会把它当成未知参数直接失败。其余 leg 仍跑全量 npm test。
      - name: Coverage floor (backend src/)
        if: matrix.node-version == '22'
        run: npm run test:coverage

      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run frontend tests
        run: npm run test:web

      - name: Coverage floor (web/src)
        if: matrix.node-version == '22'
        run: npm run test:coverage:web

      - name: Build web bundle
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check

  lint:
    # 静态门禁：只跑一次就够，放进 matrix 会在三个 leg 上重复三遍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts：安装阶段不跑 prepack，lint 由下面的显式步骤负责
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  browser-smoke:
    # e2e gate: the real plugin bundle mounting inside a host page, driven by a
    # synthetic microphone against fully mocked plugin APIs (no network calls).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Plugin mount smoke (fake microphone, mock APIs)
        run: npm run test:browser

      - name: Page assertions (statistics, mock APIs)
        run: npm run test:browser:pages

      - name: Breeze voice settings (fixed voices, mock APIs)
        run: npm run test:browser:breeze
